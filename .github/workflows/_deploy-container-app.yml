# Reusable: build one service image, push it to GHCR and roll the matching Azure Container App to it.
name: Deploy container app (reusable)
on:
  workflow_call:
    inputs:
      service: { type: string, required: true }        # api | web | whatsapp | telegram
      dockerfile: { type: string, required: true }
      container_app: { type: string, required: true }  # Azure Container App name
      build_args: { type: string, required: false, default: "" }
      environment: { type: string, required: false, default: production }
    secrets:
      AZURE_CLIENT_ID: { required: true }
      AZURE_TENANT_ID: { required: true }
      AZURE_SUBSCRIPTION_ID: { required: true }

permissions:
  id-token: write   # Azure OIDC login
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.service }}
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/daksh-${{ inputs.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: ${{ inputs.build_args }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Roll Container App to the new image
        run: |
          az containerapp update \
            --name "${{ inputs.container_app }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE }}:${{ github.sha }}" \
            --revision-suffix "g${GITHUB_SHA::7}-${GITHUB_RUN_ATTEMPT}" \
            --output none
      - name: Show deployed revision
        run: |
          az containerapp show --name "${{ inputs.container_app }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "{fqdn:properties.configuration.ingress.fqdn, revision:properties.latestRevisionName, image:properties.template.containers[0].image}" -o table
