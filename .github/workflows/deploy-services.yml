# Deploys api / whatsapp / telegram as code (no containers) to Azure App Service Free (F1) plan apps in rg-daksh-qa.
# F1 can't be billed. Needs secrets AZURE_PUBLISH_PROFILE_API / _WHATSAPP / _TELEGRAM (see infrastructure/free-hosting/README.md).
name: Deploy services (Azure free)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - global.json
      - Directory.Build.props
      - services/**
      - .github/workflows/deploy-services.yml

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: dotnet publish services/api/Daksh.Api/Daksh.Api.csproj -c Release -o out/api
      - uses: azure/webapps-deploy@v3
        with:
          app-name: daksh-api-qa
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_API }}
          package: out/api

  bridge:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [whatsapp, telegram]
    defaults: { run: { working-directory: "services/${{ matrix.service }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "services/${{ matrix.service }}/package-lock.json" }
      - run: npm ci
      - run: npm run build
      - run: npm prune --omit=dev
      - name: Package
        run: |
          mkdir -p ../../out/${{ matrix.service }}
          cp -r dist node_modules package.json ../../out/${{ matrix.service }}/
      - uses: azure/webapps-deploy@v3
        with:
          app-name: daksh-${{ matrix.service }}-qa
          publish-profile: ${{ matrix.service == 'whatsapp' && secrets.AZURE_PUBLISH_PROFILE_WHATSAPP || secrets.AZURE_PUBLISH_PROFILE_TELEGRAM }}
          package: out/${{ matrix.service }}
