name: Deploy telegram
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - services/telegram/**
      - infrastructure/docker/telegram.Dockerfile
      - .github/workflows/deploy-telegram.yml
      - .github/workflows/_deploy-container-app.yml

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-container-app.yml
    with:
      service: telegram
      dockerfile: infrastructure/docker/telegram.Dockerfile
      container_app: ${{ vars.AZURE_CONTAINERAPP_TELEGRAM || 'daksh-telegram' }}

    secrets: inherit
