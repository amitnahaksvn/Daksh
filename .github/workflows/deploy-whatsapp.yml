name: Deploy whatsapp
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - services/whatsapp/**
      - infrastructure/docker/whatsapp.Dockerfile
      - .github/workflows/deploy-whatsapp.yml
      - .github/workflows/_deploy-container-app.yml

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-container-app.yml
    with:
      service: whatsapp
      dockerfile: infrastructure/docker/whatsapp.Dockerfile
      container_app: ${{ vars.AZURE_CONTAINERAPP_WHATSAPP || 'daksh-whatsapp' }}

    secrets: inherit
