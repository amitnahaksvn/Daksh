name: Build images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [apps/web/**, services/**, infrastructure/docker/**, global.json, Directory.Build.props]

permissions:
  contents: read
  packages: write

env:
  API_FQDN: daksh-api.salmonmushroom-0ed2f93e.centralindia.azurecontainerapps.io

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, file: infrastructure/docker/api.Dockerfile }
          - { name: whatsapp, file: infrastructure/docker/whatsapp.Dockerfile }
          - { name: telegram, file: infrastructure/docker/telegram.Dockerfile }
          - { name: web, file: infrastructure/docker/web.Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/amitnahaksvn/daksh-${{ matrix.name }}:latest
          build-args: ${{ matrix.name == 'web' && format('NEXT_PUBLIC_API_URL=https://{0}', env.API_FQDN) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
