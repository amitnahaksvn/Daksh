<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Daksha</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: Canvas; color: CanvasText; }
  main { max-width: 28rem; padding: 2rem; text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  p { opacity: .75; margin: .25rem 0 1.25rem; }
  button { font: inherit; font-weight: 600; padding: .6rem 1.4rem; border-radius: 999px; border: 0; background: #7c3aed; color: #fff; cursor: pointer; }
  code { opacity: .7; font-size: .85rem; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>Daksha can't be reached</h1>
  <p>Check your internet connection. Your data is safe; nothing was lost.</p>
  <button id="retry" type="button">Try again</button>
  <p><code id="where"></code></p>
</main>
<script>
  const target = new URLSearchParams(location.search).get("target") || "";
  document.getElementById("where").textContent = target;
  document.getElementById("retry").addEventListener("click", () => { if (target) location.href = target; });
  window.addEventListener("online", () => { if (target) location.href = target; });
</script>
</body>
</html>
