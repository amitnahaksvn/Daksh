# Local development stack: API, worker. MongoDB is a remote Atlas cluster (see .env.example) -- nothing to
# run locally for it. The web app (npm run dev) and Flutter app run on the host, not in Docker.
services:
  api:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Mongo__ConnectionString: ${MONGO_CONNECTION_STRING}
      Mongo__Database: ${MONGO_DATABASE}
      Auth__Mode: Development
    ports: ["5080:8080"]

  worker:
    build: { context: ., dockerfile: infrastructure/docker/worker.Dockerfile }
    environment:
      Mongo__ConnectionString: ${MONGO_CONNECTION_STRING}
      Mongo__Database: ${MONGO_DATABASE}
