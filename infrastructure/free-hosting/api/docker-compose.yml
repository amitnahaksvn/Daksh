# VM 1 (Oracle Always Free micro): the API + Caddy. Copy .env.example to .env here and fill it in.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { API_HOST: "${API_HOST}" }
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data"]
    depends_on: [api]
    mem_limit: 96m
  api:
    image: ghcr.io/${GHCR_OWNER}/daksh-api:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      DOTNET_GCHeapHardLimit: "0x1C000000"   # ~448 MB heap cap on a 1 GB VM
      # Microsoft sign-in (non-secret). The client id and secret stay in .env on the VM. The redirect URI must also be registered in Entra.
      # Shopping carts run on the bridges VM; the live sign-in view is reached by the browser through its public host. The internal key stays in .env.
      Integrations__Shopping__BaseUrl: https://shopping.140-245-252-254.sslip.io
      Integrations__Shopping__Stores: flipkart   # Amazon refuses the cloud server's address; its cart works only from a local helper
      Integrations__Shopping__PublicStreamUrl: wss://shopping.140-245-252-254.sslip.io/stream
      Microsoft__OAuth__Tenant: common
      Microsoft__OAuth__RedirectUri: https://api.140-245-242-128.sslip.io/api/integrations/microsoft/callback
      Microsoft__OAuth__FrontendUrl: https://qa.daksha.ampalab.com/apps/microsoft
    mem_limit: 640m
volumes:
  caddy_data:
